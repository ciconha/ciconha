# ⚔ GuildenKain — GitHub Guild Card
# Coloque em: .github/workflows/guild-card.yml
# Atualiza o cartão automaticamente todo dia às 06:00 UTC

name: Update Guild Card

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest card
        run: |
          curl -sL "https://raw.githubusercontent.com/ciconha/ciconha/main/guild-card.svg" -o guild-card.svg || true

      - name: Commit & Push
        run: |
          git config user.name "Guild Bot"
          git config user.email "guild-bot@users.noreply.github.com"
          git add guild-card.svg || true
          git diff --staged --quiet || git commit -m "⚔ Update Guild Card [skip ci]"
          git push || true

# ─────────────────────────────────────────────────
# USO:
# 1. Baixe o SVG pelo botão "Baixar SVG"
# 2. Coloque guild-card.svg na raiz do seu repositório
# 3. Adicione este arquivo em .github/workflows/guild-card.yml
# 4. No README.md, adicione:
#    ![Guild Card](./guild-card.svg)
# ─────────────────────────────────────────────────
