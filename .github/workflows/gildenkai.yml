name: "👨‍💻 DEV HERO CARD"

on:
  workflow_dispatch:
    inputs:
      github_user:
        description: 'Usuário do GitHub'
        required: true
        default: 'ciconha'
      full_name:
        description: 'Nome completo'
        required: false
        default: ''
      company:
        description: 'Empresa/Organização'
        required: false
        default: 'INSS'
      role:
        description: 'Cargo/Função'
        required: false
        default: 'Desenvolvedor'
      location:
        description: 'Localização'
        required: false
        default: 'Brasil'
      
      # Tech Stack
      main_language:
        description: 'Linguagem principal'
        required: false
        default: 'JavaScript'
      framework:
        description: 'Framework principal'
        required: false
        default: 'React'
      database:
        description: 'Banco de dados'
        required: false
        default: 'PostgreSQL'
      
      # Stats
      experience:
        description: 'Anos de experiência'
        required: false
        default: '2'
      availability:
        description: 'Disponibilidade (%)'
        required: false
        default: '80'

permissions:
  contents: write

jobs:
  create-dev-card:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
      
      - name: ⚙️ Instalar dependências
