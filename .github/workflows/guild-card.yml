name: Update Guild Card

# ⬇ ESTE BLOCO É O QUE FAZ O BOTÃO "Run workflow" APARECER
on:
  workflow_dispatch:
    inputs:
      username:
        description: 'GitHub username (vazio = dono do repo)'
        required: false
        default: 'ciconha'
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'guild-card-templates.js'
      - '.github/scripts/guild-card.mjs'

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Guild Card
        env:
          GH_USERNAME: ${{ github.event.inputs.username || 'ciconha' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/guild-card.mjs

      - name: Commit & Push
        run: |
          git config user.name "Guild Bot"
          git config user.email "guild-bot@users.noreply.github.com"
          git add guild-card.svg guild-card.yml
          git diff --staged --quiet || git commit -m "⚔ Update Guild Card [skip ci]"
          git push
